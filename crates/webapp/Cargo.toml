[package]
name = "mc-web"
description = "WebAssembly build of the voxel game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
voxel.workspace = true
mc-client.workspace = true
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = [
    "console", "Window", "Document", "Element", "HtmlCanvasElement",
    "Event", "EventTarget", "KeyboardEvent", "MouseEvent", "WheelEvent",
    "Storage", "Location", "Performance", "DomRect", "MediaQueryList",
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
