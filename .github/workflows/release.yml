name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  test:
    name: Test & web package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suites (engine + integration sim)
        run: set -o pipefail && npm test 2>&1 | tee test.log

      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::invalid tag: $TAG (expected e.g. v1.1.0)"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VER="${TAG#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Create tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -a "$TAG" -m "Voxelheim $TAG" "$GITHUB_SHA"
          git push origin "$TAG" --force

      - name: Package web bundle
        run: node tools/package.mjs "$VER"

      - name: Render texture previews
        run: node tools/selftest.mjs
        env:
          VOXELHEIM_TEX_OUT: tex-preview

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: voxelheim-web-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload texture previews
        uses: actions/upload-artifact@v4
        with:
          name: texture-previews-${{ github.sha }}
          path: tex-preview/*.png
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Voxelheim ${{ env.TAG || github.ref_name }} — tests"
            echo ""
            if [ -f test.log ]; then
              echo '```'
              grep -E "^(PASS|FAIL|[0-9]+/[0-9]+)" test.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: win-x64
            args: --win --x64
          - os: macos-latest
            label: mac-x64
            args: --mac --x64
          - os: macos-latest
            label: mac-arm64
            args: --mac --arm64
          - os: ubuntu-22.04
            label: linux-x64
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install rpmbuild (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build desktop app
        shell: bash
        run: set -o pipefail && npx electron-builder ${{ matrix.args }} --publish never 2>&1 | tee desktop-build.log

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item dist-desktop/*.exe stage/ -ErrorAction SilentlyContinue
          Copy-Item dist-desktop/*.blockmap stage/ -ErrorAction SilentlyContinue
          Get-ChildItem stage | ForEach-Object { $_.Name }

      - name: Stage artifacts (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage
          cp dist-desktop/*.dmg stage/ 2>/dev/null || true
          cp dist-desktop/*.zip stage/ 2>/dev/null || true
          cp dist-desktop/*.rpm stage/ 2>/dev/null || true
          cp dist-desktop/*.AppImage stage/ 2>/dev/null || true
          cp dist-desktop/*.deb stage/ 2>/dev/null || true
          ls -la stage/

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}-${{ github.sha }}
          path: stage/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [test, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VER="${TAG#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Verify every platform shipped
        run: |
          find assets -type f | sort
          miss=0
          check () {
            local label="$1"; shift
            local found=0
            for pat in "$@"; do
              if [ -n "$(find assets -name "$pat" -print -quit)" ]; then found=1; break; fi
            done
            if [ "$found" = 1 ]; then
              echo "ok: $label"
            else
              echo "::error::missing release asset: $label"
              miss=1
            fi
          }
          check "windows setup"   "Voxelheim-$VER-Windows-Setup-x64.exe"
          check "windows portable" "Voxelheim-$VER-Windows-Portable-x64.exe"
          check "mac dmg x64"     "Voxelheim-$VER-macOS-x64.dmg"
          check "mac dmg arm64"   "Voxelheim-$VER-macOS-arm64.dmg"
          check "linux rpm"       "Voxelheim-$VER-Linux-x86_64.rpm"
          check "linux appimage"  "Voxelheim-$VER-Linux-x86_64.AppImage"
          check "linux deb"       "Voxelheim-$VER-Linux-amd64.deb" "Voxelheim-$VER-Linux-x86_64.deb" "Voxelheim-$VER-Linux-x64.deb"
          check "web bundle"      "voxelheim-$VER.zip"
          check "texture atlas"   "atlas_big.png"
          check "texture creatures" "mobs.png"
          [ "$miss" = 1 ] && exit 1
          echo "all expected assets present"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(find assets -type f | sort)
          cat > release-notes.md <<EOF
          **Voxelheim $TAG** — a hand-built voxel sandbox: original engine, original creatures, code-painted textures.

          | Platform | How to run |
          |---|---|
          | Windows | Run \`Voxelheim-$VER-Windows-Setup-x64.exe\` (installer) or the \`-Portable-\` exe |
          | macOS | Open the DMG and drag to Applications — \`arm64\` for Apple Silicon, \`x64\` for Intel |
          | Linux | Install the \`.rpm\` / \`.deb\`, or run the \`.AppImage\` directly (\`chmod +x\` first) |
          | Web | Unzip \`voxelheim-$VER.zip\`, then \`npm install && npm start\` → http://localhost:3000 |

          Built from commit $GITHUB_SHA. See the commit history for changes.
          EOF
          if ! gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Voxelheim $TAG" \
            --notes-file release-notes.md \
            $FILES 2>gh-create-error.txt; then
            echo "--- gh release create failed ---"
            cat gh-create-error.txt
            echo "--- files ---"
            echo "$FILES" | head -30
            PAYLOAD=$(sed ':a;N;$!ba;s/\n/%0A/g' gh-create-error.txt | tail -c 1200)
            echo "::error title=gh release create::${PAYLOAD:-<no stderr>}"
            exit 1
          fi

      - name: Job summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Voxelheim ${{ env.TAG || github.ref_name }}"
            echo ""
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Released: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
              echo ""
              echo "| asset | size |"
              echo "|---|---|"
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "| \(.name) | \(.size) bytes |"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
