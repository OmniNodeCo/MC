name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & package (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suites (engine + integration sim)
        run: set -o pipefail && npm test 2>&1 | tee test.log

      - name: Render texture previews
        run: node tools/selftest.mjs
        env:
          VOXELHEIM_TEX_OUT: tex-preview

      - name: Package web bundle
        run: node tools/package.mjs

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: voxelheim-web-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload texture previews
        uses: actions/upload-artifact@v4
        with:
          name: texture-previews-${{ github.sha }}
          path: tex-preview/*.png
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Voxelheim build — \`${{ github.sha }}\`"
            echo ""
            if [ -f test.log ]; then
              echo "### Test results"
              echo '```'
              grep -E "^(PASS|FAIL|[0-9]+/[0-9]+)" test.log || true
              echo '```'
              echo ""
            fi
            if [ -d tex-preview ]; then
              echo "### Texture previews"
              echo "| atlas | creatures & HUD |"
              echo "|---|---|"
              echo "| ![atlas](tex-preview/atlas_big.png) | ![mobs](tex-preview/mobs.png) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop ${{ matrix.os }}
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install rpmbuild (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build desktop app
        shell: bash
        run: set -o pipefail && npx electron-builder ${{ matrix.args }} --publish never 2>&1 | tee desktop-build.log

      - name: Push build log to scratch ref (temporary debug)
        if: failure()
        shell: bash
        run: |
          perl -pe 's/\e\[[0-9;]*m//g' desktop-build.log > "eb-log-${{ matrix.os }}.txt" 2>/dev/null || cp desktop-build.log "eb-log-${{ matrix.os }}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "eb-log-${{ matrix.os }}.txt"
          git commit -q -m "ci debug log [skip ci]"
          git push origin "HEAD:refs/tmp/desktop-logs-${{ matrix.os }}" --force || echo "log push failed"

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item dist-desktop/*.exe stage/ -ErrorAction SilentlyContinue
          Copy-Item dist-desktop/*.blockmap stage/ -ErrorAction SilentlyContinue
          Copy-Item dist-desktop/latest*.yml stage/ -ErrorAction SilentlyContinue
          Get-ChildItem stage | ForEach-Object { $_.Name }

      - name: Stage artifacts (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage
          cp dist-desktop/*.dmg stage/ 2>/dev/null || true
          cp dist-desktop/*.zip stage/ 2>/dev/null || true
          cp dist-desktop/*.rpm stage/ 2>/dev/null || true
          cp dist-desktop/*.AppImage stage/ 2>/dev/null || true
          cp dist-desktop/*.deb stage/ 2>/dev/null || true
          cp dist-desktop/latest*.yml stage/ 2>/dev/null || true
          ls -la stage/

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ github.sha }}
          path: stage/*
          if-no-files-found: error

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Desktop build — ${{ matrix.os }}"
            echo ""
            echo '```'
            (ls -la stage/ 2>/dev/null || ls -la dist-desktop/ 2>/dev/null || true)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
