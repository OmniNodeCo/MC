name: CI

on:
  push:
    branches: [arena/da57a0d8-mc, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Commits that only refresh the wasm bundle do not need a new CI run.
  SKIP_CI: ${{ contains(github.event.head_commit.message, '[skip ci]') }}

jobs:
  native:
    name: native (linux)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets || true
      - name: Format (advisory)
        run: cargo fmt --all -- --check || true
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Build release binary
        run: cargo build --release -p mc-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: mc-linux-x86_64
          path: target/release/mc
          if-no-files-found: error

  wasm:
    name: wasm (webgl2)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build wasm bundle
        run: wasm-pack build crates/webapp --target web --release --out-dir ../../web/pkg --out-name mc
      - uses: actions/upload-artifact@v4
        with:
          name: web-pkg
          path: web/pkg
          if-no-files-found: error
      # Artifact downloads are blocked for the agent sandbox, so the built
      # bundle is committed back to the branch. `git pull` picks it up.
      - name: Publish wasm bundle to branch
        run: |
          git config user.name "mc-ci"
          git config user.email "ci@omninode.dev"
          git add -f web/pkg
          if git diff --cached --quiet; then
            echo "wasm bundle unchanged"
            exit 0
          fi
          git commit -m "chore: refresh wasm bundle [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
