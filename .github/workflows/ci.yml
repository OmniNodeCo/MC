name: CI

on:
  push:
    branches: [arena/da57a0d8-mc, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build and test
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers || true
          ls /usr/share/vulkan/icd.d/ || true
      - name: Check
        run: |
          mkdir -p ci
          echo "${{ github.run_id }} ${{ github.sha }}" > ci/run-id.txt
          set +e
          cargo check --workspace --all-targets > ci/check.log 2>&1
          echo $? > ci/check.status
          cargo clippy --workspace --all-targets > ci/clippy.log 2>&1 || true
          set -e
      - name: Test
        run: |
          set +e
          export LIBGL_ALWAYS_SOFTWARE=1
          cargo test --workspace --no-fail-fast > ci/test.log 2>&1
          echo $? > ci/test.status
          cargo test -p mc-client --test gpu_smoke -- --nocapture >> ci/test.log 2>&1
          set -e
      - name: Build release binary
        run: |
          set +e
          cargo build --release -p mc-desktop > ci/build.log 2>&1
          echo $? > ci/build.status
          set -e
      - name: Build wasm bundle
        run: |
          set +e
          rustup target add wasm32-unknown-unknown > ci/wasm.log 2>&1
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh >> ci/wasm.log 2>&1
          wasm-pack build crates/webapp --target web --release \
            --out-dir ../../web/pkg --out-name mc >> ci/wasm.log 2>&1
          echo $? > ci/wasm.status
          set -e
      - name: Summarise and publish
        run: |
          set -e
          {
            echo "run: ${{ github.run_id }} $(date -u)"
            echo "commit: ${{ github.sha }}"
            echo "native check: $(cat ci/check.status 2>/dev/null || echo missing)"
            echo "native test:  $(cat ci/test.status 2>/dev/null || echo missing)"
            echo "native build: $(cat ci/build.status 2>/dev/null || echo missing)"
            echo "wasm build:   $(cat ci/wasm.status 2>/dev/null || echo missing)"
            echo
            echo "===== gpu smoke test ====="
            grep -E "rendered |wrote |no GPU adapter" ci/test.log | tail -5 || true
            echo
            for f in check test build wasm; do
              if [ -f "ci/$f.log" ] && [ "$(cat ci/$f.status 2>/dev/null)" != "0" ]; then
                echo "===== $f.log (errors) ====="
                grep -E "^(error|error\\[)" -A 4 "ci/$f.log" | head -70 || true
                echo "----- last lines -----"
                tail -n 20 "ci/$f.log" || true
              fi
            done
            echo
            echo "===== test summary ====="
            grep -E "^test result" ci/test.log | tail -8 || true
          } > ci/summary.txt
          head -80 ci/summary.txt

          git config user.name "mc-ci"
          git config user.email "ci@omninode.dev"
          git add -f -A ci
          if [ -d web/pkg ]; then
            git add -f web/pkg
          fi
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "chore: CI build output [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            git pull --rebase origin ${{ github.ref_name }} || true
          done
          exit 1
      - name: Fail when anything failed
        run: |
          for f in ci/check.status ci/test.status ci/build.status ci/wasm.status; do
            if [ -f "$f" ] && [ "$(cat $f)" != "0" ]; then
              echo "== $f =="
              cat "$f"
              exit 1
            fi
          done
